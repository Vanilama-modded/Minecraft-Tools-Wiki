<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.svg">
    <meta charset="UTF-8">
    <meta property="og:title" content="Minecraft Tools Wiki">
    <meta property="og:description" content="Complete reference guide for Minecraft tools and resources.">
    <meta property="og:image" content="https://raw.githubusercontent.com/Vanilama-modded/Minecraft-Tools-Wiki/main/banner.webp">
    <meta property="og:url" content="https://vanilama-modded.github.io/Minecraft-Tools-Wiki/">
    <meta property="og:type" content="website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Tools Wiki</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <header class="page-header-layout">
            <a href="https://minecraft-tools-wiki.vercel.app/" target="_blank" rel="noopener noreferrer" class="brand-lockup">
                <div class="brand-lockup">
                    <img src="favicon.svg" alt="Minecraft Tools Wiki Logo" class="logo">
                    <h1 class="page-title">
                        Minecraft <br>
                        Tools Wiki
                    </h1>
                </div>
            </a>
            <div class="search-section">
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <label for="SearchInput" class="screen-reader-only">Search tools</label>
                        <input
                            type="text"
                            id="SearchInput"
                            aria-label="Search tools"
                            aria-controls="searchSuggestions"
                            placeholder="Search for tools, generators and other sites"
                            class="search-input"
                        >
                        <div id="searchSuggestions" class="search-suggestions is-hidden" aria-label="Search suggestions" role="region">
                            <div id="suggestionsList" class="search-suggestions-list"></div>
                        </div>
                    </div>
                </div>
            </header>
        </div>
        
        <main  role="main" aria-label="Main content">
            <div class="tools-panel">
                <div class="tools-table-scroll">
                    <table class="tools-table" id="toolsTable">
                        <thead class="tools-table-head">
                            <tr>
                                <th class="tools-table-heading">
                                    <i class="fas fa-tools heading-icon"></i>Tool
                                </th>
                                <th class="tools-table-heading">
                                    <i class="fas fa-link heading-icon"></i>Links
                                </th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="tools-table-body">
                        </tbody>
                    </table>
                </div>
                
                <div class="mobile-cards" id="mobileCards">
                </div>
            </div>
        </main>

        <footer>
            <div class="page-footer">
            <p> Not an official Minecraft website. Not affiliated with Mojang or Microsoft.</p>
            <div class="footer-separator"></div>
            <p>Made by <a href="https://vanilama.vercel.app/" class="footer-link" target="_blank" rel="noopener noreferrer">Vanilama <img src="Vanilama_minecraft_player_head.png" alt="Vanilama Minecraft Player Head" class="footer-avatar"></a></p>
            
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>   
</body>
</html>
