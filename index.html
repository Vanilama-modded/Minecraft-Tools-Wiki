<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.svg">
    <meta charset="UTF-8">
    <meta property="og:title" content="Minecraft Tools Wiki">
    <meta property="og:description" content="Complete reference guide for Minecraft tools and resources.">
    <meta property="og:image" content="https://raw.githubusercontent.com/Vanilama-modded/Minecraft-Tools-Wiki/main/banner.webp">
    <meta property="og:url" content="https://vanilama-modded.github.io/Minecraft-Tools-Wiki/">
    <meta property="og:type" content="website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Tools Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-zinc-900 mb-4 border border-zinc-800">
                <img src="favicon.svg" alt="Minecraft Tools Wiki" class="w-10 h-10">
            </div>
            <h1 class="text-4xl font-bold text-zinc-100 mb-2">
                 Minecraft Tools Wiki
            </h1>
            <p class="text-zinc-400">
                Complete reference guide for Minecraft tools and resources
            </p>
        </header>
        
        <div class="mb-6">
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <label for="aiSearchInput" class="sr-only">Search tools</label>
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-magnifying-glass text-zinc-500" id="searchIcon" aria-hidden="true"></i>
                    </div>
                    <input 
                        type="text" 
                        id="aiSearchInput" 
                        aria-label="Search tools"
                        aria-controls="searchSuggestions"
                        placeholder="Search for tools, generators, maps..."
                        class="w-full pl-12 pr-4 py-3 bg-zinc-900 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-700 text-base"
                    >
                </div>
                <div id="searchSuggestions" class="mt-1 bg-zinc-900 hidden border border-zinc-800 z-50" aria-label="Search suggestions" role="region">
                    <div id="suggestionsList"></div>
                </div>
            </div>
        </div>
        
        <main role="main" aria-label="Main content">
            <div class="bg-zinc-900 border border-zinc-800 overflow-hidden">
                <div class="hidden md:block overflow-x-auto">
                    <table class="w-full border-collapse" id="toolsTable">
                        <thead class="border-b border-zinc-800 bg-zinc-900">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-zinc-400 uppercase">
                                    <i class="fas fa-tools mr-2"></i>Tool
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-zinc-400 uppercase">
                                    <i class="fas fa-info-circle mr-2"></i>Description
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-zinc-400 uppercase">
                                    <i class="fas fa-link mr-2"></i>Links
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-zinc-400 uppercase">
                                    <i class="fas fa-tag mr-2"></i>Price
                                </th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-zinc-800">
                        </tbody>
                    </table>
                </div>
                
                <div class="md:hidden" id="mobileCards">
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
